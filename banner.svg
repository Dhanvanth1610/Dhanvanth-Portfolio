<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Dhanvanth SenthilKumar, portfolio">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0a14"/><stop offset="1" stop-color="#1a1230"/></linearGradient>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b5cff"><animate attributeName="stop-color" values="#7b5cff;#4de8d0;#ff5fa2;#7b5cff" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#4de8d0"><animate attributeName="stop-color" values="#4de8d0;#ff5fa2;#7b5cff;#4de8d0" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#7b5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7b5cff" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#4de8d0" stop-opacity=".4"/><stop offset="1" stop-color="#4de8d0" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="1200" height="320" rx="22"/></clipPath>
</defs>
<style>.name{font:800 64px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-1px}.role{font:500 24px 'Courier New',monospace;fill:#cfc8e8}.tag{font:500 14px 'Courier New',monospace;fill:#8b84a8;letter-spacing:3px}</style>
<g clip-path="url(#c)">
<rect width="1200" height="320" fill="url(#bg)"/>
<circle r="260" fill="url(#o1)"><animateTransform attributeName="transform" type="translate" values="150,80;420,240;150,80" dur="14s" repeatCount="indefinite"/></circle>
<circle r="230" fill="url(#o2)"><animateTransform attributeName="transform" type="translate" values="1050,260;780,60;1050,260" dur="12s" repeatCount="indefinite"/></circle>
<g stroke="#7b5cff" stroke-opacity=".18" fill="none"><path d="M0 250 Q300 190 600 250 T1200 250"><animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 250 Q300 190 600 250 T1200 250;M0 250 Q300 310 600 250 T1200 250;M0 250 Q300 190 600 250 T1200 250"/></path><path d="M0 275 Q300 235 600 275 T1200 275"><animate attributeName="d" dur="11s" repeatCount="indefinite" values="M0 275 Q300 235 600 275 T1200 275;M0 275 Q300 320 600 275 T1200 275;M0 275 Q300 235 600 275 T1200 275"/></path></g>
<g fill="#fff"><circle cx="90" cy="50" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="210" cy="120" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle><circle cx="330" cy="40" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="5s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="480" cy="90" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="6s" begin="1.2s" repeatCount="indefinite"/></circle><circle cx="720" cy="45" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle><circle cx="860" cy="110" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="4s" begin="2.0s" repeatCount="indefinite"/></circle><circle cx="990" cy="55" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="5s" begin="2.4s" repeatCount="indefinite"/></circle><circle cx="1100" cy="130" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="6s" begin="2.8s" repeatCount="indefinite"/></circle><circle cx="140" cy="200" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="3s" begin="3.2s" repeatCount="indefinite"/></circle><circle cx="1130" cy="210" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="4s" begin="3.6s" repeatCount="indefinite"/></circle><circle cx="60" cy="270" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="5s" begin="4.0s" repeatCount="indefinite"/></circle><circle cx="930" cy="160" r="1.6" opacity=".2"><animate attributeName="opacity" values=".1;.9;.1" dur="6s" begin="4.4s" repeatCount="indefinite"/></circle></g>
</g>
<text x="600" y="92" text-anchor="middle" class="tag">PORTFOLIO · 2026<animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
<text x="600" y="168" text-anchor="middle" class="name" fill="url(#tx)">Dhanvanth SenthilKumar<animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0,14;0,0" dur="1.4s" fill="freeze"/></text>
<text x="600" y="214" text-anchor="middle" class="role" opacity="0">AI &amp; Data Science student<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.010;0.240;0.250;1" values="1;1;1;0;0"/></text>
<text x="600" y="214" text-anchor="middle" class="role" opacity="0">Computer vision · medical ML<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.250;0.260;0.490;0.500;1" values="0;0;1;1;0;0"/></text>
<text x="600" y="214" text-anchor="middle" class="role" opacity="0">Real-time systems · FastAPI · Node<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.500;0.510;0.740;0.750;1" values="0;0;1;1;0;0"/></text>
<text x="600" y="214" text-anchor="middle" class="role" opacity="0">Published at ICACIT 2025<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.750;0.760;0.990;1.000;1" values="0;0;1;1;0;0"/></text>

<rect x="540" y="250" width="120" height="3" rx="1.5" fill="url(#tx)"><animate attributeName="width" values="0;120;120;0" keyTimes="0;.15;.85;1" dur="12s" repeatCount="indefinite"/><animate attributeName="x" values="600;540;540;600" keyTimes="0;.15;.85;1" dur="12s" repeatCount="indefinite"/></rect>
</svg>